<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IsaacTI - The Binding of Isaac Personality Test</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a0a1a; color:#e0d0e0; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; }
.pixel-font { font-family:'Press Start 2P',monospace; }
.container { max-width:800px; margin:0 auto; padding:20px; }
.btn { background:#4a1a4a; border:2px solid #ff6b6b; color:#ff6b6b; padding:12px 24px; cursor:pointer; font-size:16px; transition:all 0.2s; font-family:inherit; }
.btn:hover { background:#ff6b6b; color:#1a0a1a; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
.lang-toggle { position:fixed; top:10px; right:10px; z-index:100; background:#2a1a2a; border:1px solid #ff6b6b; color:#ff6b6b; padding:8px 16px; cursor:pointer; font-size:14px; }
.lang-toggle:hover { background:#ff6b6b; color:#1a0a1a; }

.welcome { text-align:center; padding:40px 20px; }
.welcome h1 { font-family:'Press Start 2P',monospace; color:#ff6b6b; font-size:24px; margin-bottom:20px; line-height:1.6; }
.welcome .subtitle { color:#b090b0; font-size:16px; margin-bottom:30px; line-height:1.8; }
.welcome .start-btn { font-family:'Press Start 2P',monospace; font-size:18px; padding:20px 40px; }
.char-count { color:#ff6b6b; font-size:20px; margin:15px 0; }

.progress-bar { width:100%; height:8px; background:#2a1a2a; border-radius:4px; margin:20px 0; }
.progress-fill { height:100%; background:linear-gradient(90deg,#ff6b6b,#ff9f6b); border-radius:4px; transition:width 0.3s; }
.progress-text { text-align:center; color:#b090b0; font-size:14px; margin-bottom:10px; }

.question-card { background:#2a1a2a; border:1px solid #4a2a4a; border-radius:12px; padding:30px; margin:20px 0; }
.question-dim { color:#ff6b6b; font-size:12px; margin-bottom:10px; text-transform:uppercase; letter-spacing:2px; }
.question-text { font-size:20px; line-height:1.6; margin-bottom:25px; color:#fff; }
.options { display:flex; flex-direction:column; gap:12px; }
.option { background:#1a0a1a; border:2px solid #4a2a4a; border-radius:8px; padding:16px 20px; cursor:pointer; transition:all 0.2s; font-size:16px; color:#d0c0d0; text-align:left; width:100%; font-family:inherit; }
.option:hover { border-color:#ff6b6b; background:#3a1a3a; }
.option.selected { border-color:#ff6b6b; background:#4a1a4a; color:#fff; }
.option .opt-label { color:#ff6b6b; font-weight:bold; margin-right:10px; }

.result-page { text-align:center; padding:20px; }
.result-title { font-family:'Press Start 2P',monospace; color:#ff6b6b; font-size:20px; margin:20px 0; line-height:1.6; }
.match-card { background:#2a1a2a; border:2px solid #ff6b6b; border-radius:16px; padding:30px; margin:20px auto; max-width:500px; }
.match-card .char-name { font-family:'Press Start 2P',monospace; font-size:18px; color:#ff6b6b; margin:10px 0; }
.match-card .char-name-cn { font-size:28px; color:#fff; margin:5px 0; }
.match-card .char-img { width:96px; height:96px; image-rendering:pixelated; margin:15px auto; display:block; }
.match-card .match-pct { font-family:'Press Start 2P',monospace; font-size:36px; color:#ff9f6b; margin:10px 0; }
.match-card .char-quote { color:#b090b0; font-style:italic; margin:10px 0; font-size:15px; line-height:1.6; }
.match-card .char-desc { color:#d0c0d0; margin:15px 0; font-size:14px; line-height:1.8; text-align:left; }

.radar-container { margin:30px auto; max-width:400px; }
.radar-container canvas { width:100%; height:auto; }

.pattern-display { background:#1a0a1a; border:1px solid #4a2a4a; border-radius:8px; padding:15px; margin:20px auto; max-width:500px; font-family:'Press Start 2P',monospace; font-size:14px; color:#ff6b6b; letter-spacing:4px; word-break:break-all; }
.pattern-label { color:#b090b0; font-size:12px; margin-bottom:8px; }

.ranking { margin:30px auto; max-width:500px; text-align:left; }
.ranking h3 { color:#ff6b6b; margin-bottom:15px; text-align:center; }
.rank-item { display:flex; align-items:center; background:#2a1a2a; border:1px solid #4a2a4a; border-radius:8px; padding:12px; margin:8px 0; cursor:pointer; transition:all 0.2s; }
.rank-item:hover { border-color:#ff6b6b; }
.rank-item:first-child { border-color:#ff9f6b; }
.rank-num { font-family:'Press Start 2P',monospace; color:#ff6b6b; font-size:14px; width:40px; }
.rank-img { width:48px; height:48px; image-rendering:pixelated; margin:0 12px; }
.rank-info { flex:1; }
.rank-name { color:#fff; font-size:16px; }
.rank-sub { color:#b090b0; font-size:12px; }
.rank-pct { font-family:'Press Start 2P',monospace; color:#ff9f6b; font-size:14px; }

.easter-egg { background:linear-gradient(135deg,#2a0a3a,#0a1a2a); border:2px solid #9b59b6; border-radius:12px; padding:20px; margin:20px auto; max-width:500px; text-align:center; }
.easter-egg .egg-title { font-family:'Press Start 2P',monospace; color:#9b59b6; font-size:14px; }
.easter-egg .egg-text { color:#d0b0e0; margin:10px 0; font-size:14px; line-height:1.6; }

.restart-btn { margin:30px auto; display:block; font-family:'Press Start 2P',monospace; font-size:12px; padding:15px 30px; }
.footer { text-align:center; padding:30px; color:#4a3a4a; font-size:12px; margin-top:40px; }

@keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
.fade-in { animation:fadeIn 0.4s ease-out; }

.debug-bar { position:fixed; top:0; left:0; right:0; z-index:99; background:#2a0a3a; border-bottom:2px solid #9b59b6; padding:8px 20px; display:flex; align-items:center; gap:15px; font-size:13px; }
.debug-bar .debug-title { font-family:'Press Start 2P',monospace; color:#9b59b6; font-size:10px; }
.debug-bar .debug-btn { background:transparent; border:1px solid #9b59b6; color:#9b59b6; padding:4px 10px; cursor:pointer; font-size:12px; font-family:inherit; border-radius:4px; }
.debug-bar .debug-btn:hover { background:#9b59b6; color:#fff; }
.debug-bar .debug-btn.active { background:#9b59b6; color:#fff; }
.debug-gallery { padding-top:60px; }
.debug-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; padding:10px 0; }
.debug-card { background:#2a1a2a; border:1px solid #4a2a4a; border-radius:12px; padding:20px; transition:border-color 0.2s; }
.debug-card:hover { border-color:#ff6b6b; }
.debug-card .dc-header { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.debug-card .dc-img { width:64px; height:64px; image-rendering:pixelated; }
.debug-card .dc-info { flex:1; }
.debug-card .dc-name { font-family:'Press Start 2P',monospace; color:#ff6b6b; font-size:12px; }
.debug-card .dc-cn { color:#fff; font-size:20px; margin-top:4px; }
.debug-card .dc-code { font-family:'Press Start 2P',monospace; color:#4a2a4a; font-size:10px; }
.debug-card .dc-pattern { font-family:'Press Start 2P',monospace; color:#ff6b6b; font-size:11px; letter-spacing:3px; margin:8px 0; padding:6px 10px; background:#1a0a1a; border-radius:4px; display:inline-block; }
.debug-card .dc-quote { color:#b090b0; font-style:italic; font-size:13px; margin:8px 0; line-height:1.5; }
.debug-card .dc-desc { color:#d0c0d0; font-size:13px; line-height:1.6; margin-top:8px; }
.debug-card .dc-mech { color:#9b59b6; font-size:12px; margin-top:8px; line-height:1.5; }
.debug-filter { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
.debug-filter .filter-btn { background:transparent; border:1px solid #4a2a4a; color:#b090b0; padding:4px 12px; cursor:pointer; font-size:12px; font-family:inherit; border-radius:20px; }
.debug-filter .filter-btn:hover, .debug-filter .filter-btn.active { border-color:#ff6b6b; color:#ff6b6b; }
.debug-count { color:#b090b0; font-size:12px; margin-bottom:10px; }
.debug-table { width:100%; border-collapse:collapse; margin:10px 0; font-size:12px; }
.debug-table th { color:#ff6b6b; text-align:left; padding:6px 8px; border-bottom:1px solid #4a2a4a; font-weight:normal; font-size:11px; }
.debug-table td { padding:6px 8px; border-bottom:1px solid #2a1a2a; color:#d0c0d0; }
.debug-table tr:hover td { background:#2a1a2a; }
.debug-table .dt-pattern { font-family:'Press Start 2P',monospace; font-size:9px; letter-spacing:2px; color:#ff6b6b; }
.debug-table .dt-img { width:32px; height:32px; image-rendering:pixelated; vertical-align:middle; margin-right:6px; }
</style>
</head>

    const characters = [
      {"code": "ISAC", "en": "Isaac", "cn": "以撒", "pattern": "MMLMM MLMML MLMMM", "quote_cn": "我只是个孩子，为什么要承受这些……", "quote_en": "I'm just a kid, why do I have to endure this...", "desc_cn": "均衡型角色，基础 3 红心。携带炸弹和 The Dice（可重 roll 道具），是最标准的初始角色。", "desc_en": "Balanced character with 3 red hearts. Carries bombs and The Dice. The most standard starting character.", "char_desc_cn": "万金油型人格。没有极端特点，代表最普通的人面对困境时的真实反应。既不特别勇敢也不特别怯懦，既不贪婪也不吝啬。他是所有人的起点，也是大多数人的真实写照——在混乱中寻找方向。", "char_desc_en": "Jack-of-all-trades personality. No extreme traits — represents the most genuine human reaction to adversity. Neither especially brave nor especially cowardly. He is everyone's starting point and most people's true reflection — finding direction in chaos.", "img": "isaac"},
      {"code": "MAGD", "en": "Magdalene", "cn": "抹大拉", "pattern": "LHMHL HHLLM MHLHL", "quote_cn": "来，让我治愈你的伤痛。", "quote_en": "Come, let me heal your wounds.", "desc_cn": "高血量（4 红心），携带 Yum Heart（回复 1 红心）。移速较慢，适合肉盾型打法。", "desc_en": "High HP (4 red hearts), carries Yum Heart (heals 1 red heart). Slow speed, tank-style play.", "char_desc_cn": "温暖的守护者。总是冲在前面为别人挡刀，哪怕自己也在流血。过度的善良有时是一种负担，但她从不后悔。她相信爱能治愈一切，哪怕这个世界充满了恶意。", "char_desc_en": "A warm guardian. Always charges ahead to shield others, even while bleeding herself. Excessive kindness can be a burden, but she never regrets it. She believes love can heal everything, even in a world full of malice.", "img": "magdalene"},
      {"code": "CAIN", "en": "Cain", "cn": "该隐", "pattern": "LLLMH HMLHM HHMML", "quote_cn": "运气？不，这叫实力。", "quote_en": "Luck? No, this is skill.", "desc_cn": "高幸运值，携带 Lucky Foot。攻击力尚可但血量较少。赌博和献血时运气更好。", "desc_en": "High luck, carries Lucky Foot. Decent attack but low HP. Better luck gambling and donating blood.", "char_desc_cn": "赌徒与冒险家，天生幸运儿。他相信每一次门后都有宝藏，每一个骰子都该掷出 6。高风险高回报是他的信条，输了？再来一把。运气不是天上掉的，是他自己争取的。", "char_desc_en": "Gambler and adventurer, born lucky. He believes every door hides treasure and every die should roll 6. High risk, high reward is his creed. Lost? Deal again. Luck isn't given — he earns it.", "img": "cain"},
      {"code": "JUDA", "en": "Judas", "cn": "犹大", "pattern": "HMLLM LMLHM LHLLH", "quote_cn": "背叛是通向力量最短的捷径。", "quote_en": "Betrayal is the shortest path to power.", "desc_cn": "1 红心开局，携带 The Book of Belial。高攻击低血量的玻璃大炮。恶魔房概率加成。", "desc_en": "Starts with 1 red heart, carries The Book of Belial. Glass cannon with high attack, low HP. Devil room chance bonus.", "char_desc_cn": "深谋远虑的暗影行者。不介意用黑暗的手段达成目的，因为光明从来不是免费的。高攻击力的代价是脆弱的身躯，但他相信：最好的防御就是进攻。他是所有叛徒中最忠诚的那个。", "char_desc_en": "A calculating shadow walker. Doesn't mind using dark means to achieve goals, because light is never free. High attack power at the cost of fragility — he believes the best defense is offense. The most loyal among all traitors.", "img": "judas"},
      {"code": "EVE", "en": "Eve", "cn": "夏娃", "pattern": "HLLHL LHMLH LHLLL", "quote_cn": "绝境？那是我的主场。", "quote_en": "Desperation? That's my arena.", "desc_cn": "携带 Whore of Babylon（低血量时大幅提升攻击力）和 Dead Bird。低血量时才是完全体。", "desc_en": "Carries Whore of Babylon (massive attack boost at low HP) and Dead Bird. Full power at low HP.", "char_desc_cn": "绝境求生者。血量越低越强大，濒死状态才是她的完全体。她习惯了在刀尖上跳舞，因为安逸让她窒息。自残是一种策略，也是一种生活态度——痛苦让她清醒。", "char_desc_en": "Desperation survivor. Lower HP means greater power — near-death is her true form. She's used to dancing on the edge because comfort suffocates her. Self-harm is strategy and lifestyle — pain keeps her lucid.", "img": "eve"},
      {"code": "BLNK", "en": "???", "cn": "???", "pattern": "MLMML MLMML MLMML", "quote_cn": "……", "quote_en": "...", "desc_cn": "全程只有灵魂之魂（Soul Hearts），没有红心。不能使用红心回复。携带 The Poop。", "desc_en": "Only Soul Hearts, no red hearts. Cannot use red heart healing. Carries The Poop.", "char_desc_cn": "沉默的混沌体。无法用言语描述，无法用常理揣度。他以灵魂为血量，用便便作为武器，活在一个所有人都不理解他的世界里。但也许，不被理解本身就是一种自由。", "char_desc_en": "A silent chaos entity. Defies description and logic. Uses souls as HP and poop as weapon, living in a world nobody understands. But perhaps being misunderstood is itself a form of freedom.", "img": "bluebaby"},
      {"code": "SAME", "en": "Samson", "cn": "参孙", "pattern": "LLHLL HMLHL LHHLL", "quote_cn": "以血换力，绝不后悔。", "quote_en": "Blood for power, no regrets.", "desc_cn": "携带 Bloody Lust（每次受伤临时提升攻击力，最多叠加 6 次）。被打得越狠，输出越高。", "desc_en": "Carries Bloody Lust (attack boost on hit, stacks up to 6x). More damage taken = more damage dealt.", "char_desc_cn": "狂暴战士，用生命换取力量。他不懂什么叫退缩，不知道什么叫克制。被打得越惨，反击越狠。暴力是他唯一的语言，但他用得很好。", "char_desc_en": "Berserker warrior who trades life for power. He doesn't know retreat or restraint. The harder he's hit, the harder he strikes back. Violence is his only language, and he speaks it fluently.", "img": "samson"},
      {"code": "AZAZ", "en": "Azazel", "cn": "阿萨泻勒", "pattern": "LLLHL LMMLH LHHLM", "quote_cn": "翅膀比光环好用多了。", "quote_en": "Wings are way more useful than halos.", "desc_cn": "拥有飞行能力和短程 Brimstone 激光。射程短但伤害极高，前期最强角色之一。初始 3 黑心。", "desc_en": "Flight ability and short-range Brimstone laser. Short range but extreme damage. One of the strongest early-game characters. Starts with 3 black hearts.", "char_desc_cn": "堕天使的骄傲。拥有飞行能力和强力射线，是天生的破坏者。自负是他的保护色，短程是他唯一的软肋。他不后悔堕落，因为天堂太无聊了。", "char_desc_en": "The pride of fallen angels. Flight and powerful beams make him a natural destroyer. Arrogance is his armor, short range his only weakness. He doesn't regret falling — heaven was too boring.", "img": "azazel"},
      {"code": "LAZA", "en": "Lazarus", "cn": "拉撒路", "pattern": "LLMHL HHHML MLMHL", "quote_cn": "死过一次的人，不怕再死。", "quote_en": "Someone who's died once isn't afraid to die again.", "desc_cn": "携带 Anemic。死亡后自动复活为 Lazarus Risen（攻击力大幅提升）。唯一自带复活的角色。", "desc_en": "Carries Anemic. Auto-revives as Lazarus Risen (massive attack boost) on death. Only character with built-in revival.", "char_desc_cn": "复活者。死亡对他来说不是终点，而是新的开始。这种近乎鲁莽的乐观让他敢于做别人不敢做的事。反正能复活，怕什么？每一次死亡都是一次升级。", "char_desc_en": "The Risen. Death isn't an ending but a new beginning. His reckless optimism lets him dare what others won't. He can revive anyway — what's to fear? Every death is an upgrade.", "img": "lazarus"},
      {"code": "EDEN", "en": "Eden", "cn": "伊甸", "pattern": "MLMHM MLMHM MLMHM", "quote_cn": "下一秒会发生什么，谁也说不准。", "quote_en": "What happens next, nobody can say.", "desc_cn": "每局随机初始道具、属性和外观。使用 Eden Token 进入。完全的随机性角色。", "desc_en": "Random starting items, stats, and appearance each run. Requires Eden Token to enter. Fully random character.", "char_desc_cn": "混沌的化身。每次开局都是全新的随机状态，他从不抱怨命运的不公，因为公平从来不存在。适应力是他最强的武器，随机性是他最好的朋友。", "char_desc_en": "The embodiment of chaos. Every run starts with random state — he never complains about unfairness because fairness never existed. Adaptability is his greatest weapon, randomness his best friend.", "img": "eden"},
      {"code": "LOST", "en": "The Lost", "cn": "游魂", "pattern": "HHMHH LLLHL HLMHH", "quote_cn": "碰一下就碎，所以绝不能被碰到。", "quote_en": "One touch and I shatter, so I must never be touched.", "desc_cn": "无法拥有任何血量，一碰即死。但可以免费进入恶魔房，且能飞行。极致的玻璃大炮。", "desc_en": "Cannot hold any HP — one hit kills. Free devil room access and flight. Ultimate glass cannon.", "char_desc_cn": "极致的玻璃大炮。一击必死的诅咒让他成为最纯粹的高手试金石。他代表了那些在极限中寻找完美的人——不允许犯错，也不需要犯错。脆弱是他的诅咒，也是他的勋章。", "char_desc_en": "The ultimate glass cannon. One-hit-death makes him the purest test of skill. He represents those who seek perfection in the margins — no errors allowed, none needed. Fragility is his curse and his badge of honor.", "img": "thelost"},
      {"code": "LILT", "en": "Lilith", "cn": "莉莉丝", "pattern": "HLMHL LHHLM HLMLH", "quote_cn": "黑暗中，我从不孤单。", "quote_en": "In the darkness, I'm never alone.", "desc_cn": "携带 Incubus（跟随射击的恶魔宝宝）和 Cambion Conception。自身射程短，靠召唤物输出。", "desc_en": "Carries Incubus (follower demon baby) and Cambion Conception. Short personal range, relies on summons for damage.", "char_desc_cn": "召唤者与母亲。她不亲自战斗，而是让她的孩子们替她冲锋。这种间接的战斗方式反映了一种深层的依赖与被依赖——她需要被需要，她的孩子们也需要她。", "char_desc_en": "Summoner and mother. She doesn't fight personally — her children charge for her. This indirect combat reflects deep dependency — she needs to be needed, and her children need her too.", "img": "lilith"},
      {"code": "KEEP", "en": "Keeper", "cn": "店主", "pattern": "LHHLH MLMLH HHHLL", "quote_cn": "一分钱掰两半花。", "quote_en": "A penny saved is a penny earned.", "desc_cn": "使用金币作为血量（最多 2 金币容器），不能持有灵魂心。拾取金币可回血。商店折扣。", "desc_en": "Uses coins as HP (max 2 coin containers). Cannot hold soul hearts. Picking up coins heals. Shop discount.", "char_desc_cn": "极端节俭者。金币就是血量，血量就是金币，他活在一个经济与生命直接挂钩的世界里。每一分钱都要精打细算，因为他输不起。别人眼中的吝啬，在他看来是生存智慧。", "char_desc_en": "Extreme frugalist. Coins are HP, HP is coins — he lives where economy and life are directly linked. Every cent must be carefully calculated because he can't afford to lose. What others call stingy, he calls survival wisdom.", "img": "keeper"},
      {"code": "APLL", "en": "Apollyon", "cn": "亚坡仑", "pattern": "MMLML MMLMM HHMLL", "quote_cn": "吞噬一切，化为己用。", "quote_en": "Devour everything, make it your own.", "desc_cn": "携带 Void（可吞噬其他道具获得属性加成或能力）。代表虚无与吞噬。", "desc_en": "Carries Void (devours items for stat bonuses or abilities). Represents void and consumption.", "char_desc_cn": "虚空的使者。他能把任何道具转化为力量，代表了一种「万物皆可为我所用」的实用主义。他不挑剔，不感性，只要能变强，什么都可以牺牲。沉默寡言，但实力深不可测。", "char_desc_en": "Emissary of the void. Can convert any item into power — pragmatic to the core. Not picky, not sentimental — anything can be sacrificed for strength. Quiet but unfathomably powerful.", "img": "apollyon"},
      {"code": "BETH", "en": "Bethany", "cn": "伯大尼", "pattern": "HHHML HHLLM MLMHH", "quote_cn": "信仰是我最强的武器。", "quote_en": "Faith is my strongest weapon.", "desc_cn": "使用魂心充能主动道具。可携带 Book of Virtues（生成火焰跟班）。拉撒路的姐妹。", "desc_en": "Uses soul hearts to charge active items. Can carry Book of Virtues (generates flame wisps). Lazarus's sister.", "char_desc_cn": "虔诚的火焰使者。她用魂心充能，用书本召唤火焰，代表了信仰的力量。她相信善有善报，相信坚持就是胜利，哪怕世界充满了恶意。火焰是她的祈祷，也是她的武器。", "char_desc_en": "Devout flame bearer. Charges with soul hearts, summons flames from books — the power of faith incarnate. She believes good is rewarded and persistence wins, even in a world of malice. Flames are her prayer and her weapon.", "img": "bethany"},
      {"code": "JCOB", "en": "Jacob and Esau", "cn": "雅各和以扫", "pattern": "MHMHH HMLMH LMHMH", "quote_cn": "兄弟齐心，其利断金。", "quote_en": "Brothers united, unstoppable.", "desc_cn": "同时操控两个角色。雅各灵活但血低，以扫血高但笨重。可分别持有道具，兄弟间可交换。", "desc_en": "Control two characters simultaneously. Jacob is agile but fragile, Esau is tanky but slow. Each can hold different items, can swap between brothers.", "char_desc_cn": "双生羁绊。两人共享一个屏幕，需要同时操控。代表了合作与牺牲的永恒主题——有时一个人必须为另一个人挡子弹。他们争吵、妥协、互相扶持，就像所有真实的兄弟一样。", "char_desc_en": "Twin bond. Two characters sharing one screen, controlled simultaneously. Represents the eternal themes of cooperation and sacrifice — sometimes one must take a bullet for the other. They argue, compromise, and support each other like real brothers.", "img": "jacob"},
      {"code": "FORT", "en": "The Forgotten", "cn": "遗骸", "pattern": "LMHLL HLLMH HHMML", "quote_cn": "骨头是我最后的盔甲，也是我唯一的武器。", "quote_en": "Bones are my last armor and my only weapon.", "desc_cn": "使用骨头近战武器（可蓄力投掷）。只有骨心。有副角色「灵魂」可切换飞行射击。", "desc_en": "Uses bone melee weapon (chargeable throw). Only bone hearts. Sub-character The Soul can switch to flight and shooting.", "char_desc_cn": "死而未腐的战士。他只剩一副骨架，却比大多数活人都顽强。骨头是他的盔甲，灵魂是他最后的火种。他代表了那些被命运碾碎后依然站立的人——你可以夺走我的血肉，但夺不走我的意志。", "char_desc_en": "Undead warrior. Only a skeleton remains, yet more tenacious than most living beings. Bones are his armor, soul his last spark. He represents those still standing after being crushed by fate — you can take my flesh, but not my will.", "img": "theforgotten"},
      {"code": "T_IS", "en": "Tainted Isaac", "cn": "堕化以撒", "pattern": "MHMHL MMLMH MLMHM", "quote_cn": "选择太多，也是一种诅咒。", "quote_en": "Too many choices is also a curse.", "desc_cn": "道具栏上限扩展为 12 格，但每获得新道具时必须选择丢弃一个。", "desc_en": "Inventory expanded to 12 slots, but must discard one item when gaining a new one.", "char_desc_cn": "选择困难症的极致体现。他能携带更多道具，但必须不断做出取舍。这代表了现代人面对过多选择时的焦虑——拥有一切，却无法拥有一切。每一个选择都是一次失去。", "char_desc_en": "The ultimate choice anxiety. Can carry more items but must constantly make trade-offs. Represents modern anxiety about too many choices — having everything yet unable to have everything. Every choice is a loss.", "img": "t_isaac"},
      {"code": "T_MG", "en": "Tainted Magdalene", "cn": "堕化抹大拉", "pattern": "LHHLL LHHLH LHLLL", "quote_cn": "治愈？不，这次我选择撕碎一切。", "quote_en": "Healing? No, this time I choose to tear everything apart.", "desc_cn": "红心会缓慢流失，但拥有强大的近战咬击。击杀敌人有概率掉落红心。", "desc_en": "Red hearts slowly drain, but has powerful melee bite attack. Kills have a chance to drop red hearts.", "char_desc_cn": "温柔的另一面是暴虐。堕化抹大拉放弃了治愈能力，换取了近战撕咬。代表了那些长期压抑自我的人终于爆发的状态——不再当老好人了。", "char_desc_en": "The violent side of gentleness. Tainted Magdalene traded healing for melee biting. Represents those who've suppressed themselves too long finally erupting — no more being the nice one.", "img": "t_magdalene"},
      {"code": "T_CA", "en": "Tainted Cain", "cn": "堕化该隐", "pattern": "LLLMH LMLHH MHHLM", "quote_cn": "万物皆可拆解，万物皆可重组。", "quote_en": "Everything can be dismantled, everything can be reassembled.", "desc_cn": "携带 Bag of Crafting。不能正常拾取道具，所有道具自动分解为材料，可合成新道具。", "desc_en": "Carries Bag of Crafting. Cannot pick up items normally — all items auto-dismantle into materials for crafting new items.", "char_desc_cn": "工匠与破坏者。他不靠运气，靠双手。任何道具都能被拆解为材料，再合成新的东西。这是极端的实用主义——没有什么是神圣的，一切都可以被改造。", "char_desc_en": "Artisan and destroyer. Doesn't rely on luck — relies on hands. Any item can be dismantled and reassembled. Extreme pragmatism — nothing is sacred, everything can be remade.", "img": "t_cain"},
      {"code": "T_JU", "en": "Tainted Judas", "cn": "堕化犹大", "pattern": "HMMLL LMHHL LHLHH", "quote_cn": "黑暗不再是我的选择，而是我的本质。", "quote_en": "Darkness is no longer my choice — it's my essence.", "desc_cn": "携带 Dark Arts（短暂暗影状态，穿墙且接触敌人造成伤害）。无法获得红心，只有黑心。", "desc_en": "Carries Dark Arts (brief shadow state, phase through walls, contact damage). Cannot gain red hearts, only black hearts.", "char_desc_cn": "与黑暗彻底合一。他不再使用黑暗力量，他本身就是黑暗。Dark Arts 让他穿墙、无敌、造成范围伤害——他就是阴影中的死神。背叛不再是手段，而是本能。", "char_desc_en": "Completely merged with darkness. No longer uses dark power — he IS darkness. Dark Arts lets him phase through walls, become invincible, deal AoE damage — he's the reaper of shadows. Betrayal is no longer strategy, it's instinct.", "img": "t_judas"},
      {"code": "T_BL", "en": "Tainted ???", "cn": "堕化???", "pattern": "MLMLL LHMHL HMLLM", "quote_cn": "💩", "quote_en": "💩", "desc_cn": "用便便代替炸弹。不同类型的便便有不同效果。携带 Hold（可存储便便下次使用）。", "desc_en": "Uses poop instead of bombs. Different poop types have different effects. Carries Hold (store poop for later use).", "char_desc_cn": "把最被人看不起的东西变成了最强的武器。他不追求高雅，不在乎世俗眼光，用最原始的方式解决问题。有时候，最低级的手段反而最有效。", "char_desc_en": "Turned the most despised thing into the strongest weapon. Doesn't pursue refinement or care about judgment — solves problems in the most primal way. Sometimes the crudest methods are the most effective.", "img": "t_bluebaby"},
      {"code": "T_EV", "en": "Tainted Eve", "cn": "堕化夏娃", "pattern": "HLHML LHHLL LHMLL", "quote_cn": "我的血，就是我的军队。", "quote_en": "My blood is my army.", "desc_cn": "携带 Sumptorium（消耗红心生成血块跟班）。停止射击时自动将红心转化为血块。血块越多火力越强。", "desc_en": "Carries Sumptorium (consumes red hearts to generate blood clot followers). Auto-converts hearts when not shooting. More clots = more firepower.", "char_desc_cn": "从绝境战士变为鲜血女王。她用自己的血液召唤军队，每一滴血都是一个忠诚的士兵。她代表了那些为了力量不惜一切代价的人——生命？那只是弹药而已。", "char_desc_en": "From desperation warrior to blood queen. Summons armies from her own blood — every drop a loyal soldier. Represents those who sacrifice everything for power — life? That's just ammunition.", "img": "t_eve"},
      {"code": "T_SM", "en": "Tainted Samson", "cn": "堕化参孙", "pattern": "LLHLL HHLHL LHHLL", "quote_cn": "愤怒不是情绪，是一种生存状态。", "quote_en": "Rage isn't an emotion — it's a state of survival.", "desc_cn": "携带 Berserk!（进入狂暴状态：大幅加速、伤害翻倍、只能近战）。狂暴中击杀延长持续时间。", "desc_en": "Carries Berserk! (massive speed boost, double damage, melee only). Kills in berserk extend duration.", "char_desc_cn": "狂暴的极致。从被动挨打触发变为自主选择爆发。Berserk 状态下的他是不可阻挡的杀戮机器，但狂暴结束后会陷入短暂虚弱。要么不做，做就做绝。", "char_desc_en": "Berserker perfected. From passive taking hits to active eruption. In Berserk state he's an unstoppable killing machine, but falls into brief weakness after. Either don't do it, or go all the way.", "img": "t_samson"},
      {"code": "T_AZ", "en": "Tainted Azazel", "cn": "堕化阿萨泻勒", "pattern": "LLMHM LMMHL LMLHM", "quote_cn": "一口血痰，足以毁灭世界。", "quote_en": "One bloody spit can destroy the world.", "desc_cn": "Brimstone 变为巨大扇形喷射（更宽但更短）。蓄力后释放更强力的喷射。", "desc_en": "Brimstone becomes a huge fan-shaped blast (wider but shorter). Charge for a stronger blast.", "char_desc_cn": "从精准的暗杀者变为狂暴的轰炸机。他不再追求精准，而是用压倒性的火力覆盖一切。管你准不准，炸就完了。", "char_desc_en": "From precise assassin to raging bomber. No longer seeks precision — overwhelms everything with firepower. Who cares about accuracy? Just blast it.", "img": "t_azazel"},
      {"code": "T_LZ", "en": "Tainted Lazarus", "cn": "堕化拉撒路", "pattern": "MLMHM HLHML HMHML", "quote_cn": "我是谁？取决于现在是哪一个我。", "quote_en": "Who am I? Depends on which me is active.", "desc_cn": "携带 Flip，可在「活」和「死」两个状态间切换。每个状态有不同道具栏。进入新房间自动切换。", "desc_en": "Carries Flip — switch between alive and dead states. Each state has different item slots. Auto-switches on entering new rooms.", "char_desc_cn": "双面人。他不断在两个状态间切换，代表了身份认同的困惑和人格的多面性。活与死，不过一念之间。", "char_desc_en": "Two-faced. Constantly switching between states — represents identity confusion and multi-faceted personality. Life and death, separated by a single thought.", "img": "t_lazarus"},
      {"code": "T_ED", "en": "Tainted Eden", "cn": "堕化伊甸", "pattern": "MLMHM MLMHM MLMHM", "quote_cn": "混沌才是宇宙的常态。", "quote_en": "Chaos is the norm of the universe.", "desc_cn": "每次受伤都会随机重 roll 所有道具和属性。唯一不变的就是变化本身。", "desc_en": "Every hit randomly rerolls all items and stats. The only constant is change itself.", "char_desc_cn": "混沌的极致。每次受伤道具都会随机变化，代表了对确定性的彻底放弃。适应力不是选项，是生存的唯一方式。", "char_desc_en": "Chaos perfected. Items reroll on every hit — total abandonment of certainty. Adaptability isn't an option, it's the only way to survive.", "img": "t_eden"},
      {"code": "T_LS", "en": "Tainted The Lost", "cn": "堕化游魂", "pattern": "HHMHH LMLHL HLMHH", "quote_cn": "死神来了，也得排队等。", "quote_en": "Even death has to wait in line.", "desc_cn": "一碰即死但拥有 Holy Mantle（每房间一次免伤）。可免费拿恶魔房道具。", "desc_en": "One-hit death but has Holy Mantle (one free hit per room). Free devil room items.", "char_desc_cn": "永生的诅咒。他无法真正死亡（有 Holy Mantle），但代价是永远被困在生死之间。比游魂多了底气，也多了负担。", "char_desc_en": "The curse of immortality. Can't truly die (has Holy Mantle), but the cost is being trapped between life and death. More confident than The Lost, but also more burdened.", "img": "t_thelost"},
      {"code": "T_LI", "en": "Tainted Lilith", "cn": "堕化莉莉丝", "pattern": "LHLLL LHHLM LHMLH", "quote_cn": "嘴巴才是最强的武器。", "quote_en": "The mouth is the strongest weapon.", "desc_cn": "Incubus 变为舌头射线（类似鞭子）。只能通过舌头攻击。Gello 可释放胎儿跟班。", "desc_en": "Incubus becomes tongue ray (whip-like). Can only attack via tongue. Gello releases fetal follower.", "char_desc_cn": "从召唤者变为直接攻击者。她的胎儿变成舌头射线，代表了从依赖他人到自己动手的转变。不再躲在别人身后，这次要亲自动手。", "char_desc_en": "From summoner to direct attacker. Fetus becomes tongue ray — represents the shift from depending on others to doing it yourself. No more hiding behind others — this time, hands-on.", "img": "t_lilith"},
      {"code": "T_KP", "en": "Tainted Keeper", "cn": "堕化店主", "pattern": "LHHLH MLMHH HHHHL", "quote_cn": "做买卖，不做亏本生意。", "quote_en": "Do business, never at a loss.", "desc_cn": "金币血量上限提升为 3。击杀敌人掉落金币。商店物品更贵。可雇佣店员跟班。", "desc_en": "Coin HP cap raised to 3. Enemies drop coins on death. Shop items more expensive. Can hire shopkeeper followers.", "char_desc_cn": "商人本色的极致。金币仍然是血量但上限更高。代表了资本主义的极致——一切皆可定价，一切皆可交易。", "char_desc_en": "The ultimate merchant. Coins still serve as HP but with higher cap. Represents capitalism perfected — everything has a price, everything is tradeable.", "img": "t_keeper"},
      {"code": "T_AP", "en": "Tainted Apollyon", "cn": "堕化亚坡仑", "pattern": "LLMMH MMLMH HHMLL", "quote_cn": "蝗虫过境，寸草不生。", "quote_en": "Locusts pass, nothing survives.", "desc_cn": "Void 变为 Abyss（将道具转化为蝗虫跟班）。蝗虫造成接触伤害。从吸收属性变为释放蝗虫大军。", "desc_en": "Void becomes Abyss (converts items into locust followers). Locusts deal contact damage. From absorbing stats to releasing locust armies.", "char_desc_cn": "从吞噬变为释放。他不再吸收道具，而是释放蝗虫大军摧毁一切。积攒了太多，是时候释放了。蝗虫过境，寸草不生。", "char_desc_en": "From devouring to releasing. No longer absorbs items — unleashes locust armies to destroy everything. Accumulated too much, time to release. Locusts pass, nothing survives.", "img": "t_apollyon"},
      {"code": "T_BT", "en": "Tainted Bethany", "cn": "堕化伯大尼", "pattern": "HHMLL HHLMH MLMHH", "quote_cn": "信仰的火焰，可以焚烧一切。", "quote_en": "The flames of faith can burn everything.", "desc_cn": "携带 Lemegeton（生成魔法火焰跟班，每个火焰代表一个被动道具效果）。火焰可被击毁。", "desc_en": "Carries Lemegeton (generates magic flame wisps, each representing a passive item effect). Flames can be destroyed.", "char_desc_cn": "从虔诚的祈祷者变为狂热的布道者。她的火焰不再温和，而是具有毁灭性的力量。信仰的极端化——当你足够虔诚，火焰就能焚烧一切，包括自己。", "char_desc_en": "From devout prayer to fervent preacher. Her flames are no longer gentle — they carry destructive power. Faith taken to extremes — when devout enough, flames burn everything, including yourself.", "img": "t_bethany"},
      {"code": "T_JC", "en": "Tainted Jacob", "cn": "堕化雅各和以扫", "pattern": "MHHLL LMHHL LHLHH", "quote_cn": "黑暗的以扫在身后追赶，我只能不停奔跑。", "quote_en": "Dark Esau chases behind me — I can only keep running.", "desc_cn": "Dark Esau 持续追踪雅各。被碰到直接进入恶魔房。无法被杀死，只能用 Anima Sola 暂时束缚。", "desc_en": "Dark Esau continuously tracks Jacob. Touch sends you to devil room. Cannot be killed, only temporarily restrained with Anima Sola.", "char_desc_cn": "被黑暗面追逐的人。Dark Esau 是他兄弟的暗影化身，永远在身后追赶，无法消灭，只能暂时束缚。你可以跑，但你永远跑不掉。", "char_desc_en": "Chased by his dark side. Dark Esau is his brother's shadow incarnation — always pursuing, cannot be destroyed, only temporarily bound. You can run, but you can never escape.", "img": "t_jacob"},
      {"code": "T_FO", "en": "Tainted The Forgotten", "cn": "堕化遗骸", "pattern": "LMHLL HLLLM HHHHL", "quote_cn": "灵魂在外面，骨头在里面——一切都颠倒了。", "quote_en": "Soul outside, bones inside — everything is reversed.", "desc_cn": "骨骼不能移动，灵魂必须离开身体去攻击和拾取物品。灵魂可将骨骼扔到新位置。操控完全颠倒。", "desc_en": "Bones cannot move — soul must leave body to attack and pick up items. Soul can throw bones to new positions. Controls completely reversed.", "char_desc_cn": "内外颠倒的存在。灵魂在外面活动，骨骼反而成了需要保护的核心。代表了那些外表坚强、内心脆弱的人——你以为他是硬骨头，其实他的灵魂在外面流浪，无处安放。", "char_desc_en": "Inside-out existence. Soul operates outside while bones become the core to protect. Represents those who appear tough but are fragile inside — you think he's hard-boned, but his soul wanders outside, homeless.", "img": "t_theforgotten"},
    ];
    const questions = [
      {"dim": "S1", "q": 1, "cn": "你在地牢里只剩半颗红心，面前有一扇未知的门。你会？", "en": "You're at half a red heart. A mysterious door stands before you. You:", "a_cn": "冲！反正死习惯了", "a_en": "Just charge in — I'm used to dying", "b_cn": "先在门外听听动静", "b_en": "Listen at the door first", "c_cn": "回去找血量回复再说", "c_en": "Go find healing first"},
      {"dim": "S1", "q": 2, "cn": "Boss 战中你只剩最后一滴血。你会？", "en": "Boss fight, last sliver of HP. You:", "a_cn": "秀操作的时候到了！", "a_en": "Time to show off my skills!", "b_cn": "小心走位，找机会输出", "b_en": "Carefully dodge and find openings", "c_cn": "拼命跑，等安全了再说", "c_en": "Run and wait for safety"},
      {"dim": "S2", "q": 3, "cn": "你更倾向于哪种战斗方式？", "en": "Which combat style do you prefer?", "a_cn": "冲脸近战，贴身肉搏", "a_en": "Rush in, melee combat", "b_cn": "远程消耗，安全输出", "b_en": "Ranged poke, safe damage", "c_cn": "召唤帮手，让别人打", "c_en": "Summon help, let others fight"},

let lang = 'cn';
let currentQ = 0;
let answers = [];
let debugView = 'gallery';
let debugFilter = 'all';

const isDebug = new URLSearchParams(window.location.search).has('debug');

function toggleLang() {
  lang = lang === 'cn' ? 'en' : 'cn';
  render();
}

function t(cn, en) { return lang === 'cn' ? cn : en; }

function render() {
  const app = document.getElementById('app');
  if (isDebug) {
    renderDebug(app);
  } else if (currentQ === 0 && answers.length === 0) {
    renderWelcome(app);
  } else if (answers.length < questions.length) {
    renderQuestion(app);
  } else {
    renderResult(app);
  }
}

function renderDebug(el) {
  const filtered = debugFilter === 'all' ? characters
    : debugFilter === 'base' ? characters.filter(c => !c.code.startsWith('T_'))
    : debugFilter === 'tainted' ? characters.filter(c => c.code.startsWith('T_'))
    : characters;

  const bar = `
    <div class="debug-bar">
      <span class="debug-title">🔧 DEBUG</span>
      <button class="debug-btn ${debugView==='gallery'?'active':''}" onclick="debugView='gallery';render()">Gallery</button>
      <button class="debug-btn ${debugView==='table'?'active':''}" onclick="debugView='table';render()">Table</button>
      <button class="debug-btn" onclick="isDebug=false;history.replaceState(null,'','?');render()">← Exit</button>
      <span style="flex:1"></span>
      <span style="color:#b090b0;font-size:11px">${filtered.length}/${characters.length} ${t('角色','chars')}</span>
    </div>
  `;

  const filters = `
    <div class="debug-filter">
      <button class="filter-btn ${debugFilter==='all'?'active':''}" onclick="debugFilter='all';render()">All (${characters.length})</button>
      <button class="filter-btn ${debugFilter==='base'?'active':''}" onclick="debugFilter='base';render()">Base (${characters.filter(c=>!c.code.startsWith('T_')).length})</button>
      <button class="filter-btn ${debugFilter==='tainted'?'active':''}" onclick="debugFilter='tainted';render()">Tainted (${characters.filter(c=>c.code.startsWith('T_')).length})</button>
    </div>
  `;

  if (debugView === 'gallery') {
    el.innerHTML = bar + `<div class="debug-gallery"><div class="container">
      <h2 style="color:#ff6b6b;margin-bottom:5px">${t('全部角色一览','All Characters Gallery')}</h2>
      ${filters}
      <div class="debug-grid">
        ${filtered.map(c => {
          const p = c.pattern.replace(/\s/g,'').replace(/(.{3})/g,'$1 ').trim();
          return `
            <div class="debug-card">
              <div class="dc-header">
                <img class="dc-img" src="${imgMap[c.img]||''}" alt="${c.en}" />
                <div class="dc-info">
                  <div class="dc-code">${c.code}</div>
                  <div class="dc-name">${c.en}</div>
                  <div class="dc-cn">${c.cn}</div>
                </div>
              </div>
              <div class="dc-pattern">${p}</div>
              <div class="dc-quote">${t(c.quote_cn, c.quote_en)}</div>
              <div class="dc-desc">${t(c.char_desc_cn, c.char_desc_en)}</div>
              <div class="dc-mech">${t(c.desc_cn, c.desc_en)}</div>
            </div>
          `;
        }).join('')}
      </div>
    </div></div>
    <div class="footer">IsaacTI Debug Mode - ${t('以撒人格测试','The Binding of Isaac Personality Test')}</div>
    `;
  } else {
    el.innerHTML = bar + `<div class="debug-gallery"><div class="container">
      <h2 style="color:#ff6b6b;margin-bottom:5px">${t('角色模式表','Character Pattern Table')}</h2>
      ${filters}
      <table class="debug-table">
        <tr>
          <th></th><th>${t('代码','Code')}</th><th>${t('名称','Name')}</th>
          <th>${t('模式','Pattern')}</th><th>${t('类型','Type')}</th>
        </tr>
        ${filtered.map(c => {
          const p = c.pattern.replace(/\s/g,'').replace(/(.{3})/g,'$1 ').trim();

function renderWelcome(el) {
  el.innerHTML = `
    <div class="welcome fade-in">
      <h1>${t('以撒人格测试','IsaacTI')}</h1>
      <p class="subtitle">${t(
        '你是以撒的结合中的哪个人物？<br>通过 30 道题目，找出你在 34 个人物中最匹配的那一个！',
        'Which Binding of Isaac character are you?<br>Answer 30 questions to find your match among 34 characters!'
      )}</p>
      <div class="char-count">${characters.length} ${t('个人物','Characters')}</div>
      <button class="btn start-btn" onclick="startTest()">${t('开始测试','START TEST')}</button>
      <div style="margin-top:30px"><a href="?debug" style="color:#4a2a4a;font-size:11px;text-decoration:none">v1.0</a></div>
    </div>
  `;
}

function startTest() {
  currentQ = 1;
  answers = [];
  render();
}

function renderQuestion(el) {
  const q = questions[currentQ - 1];
  const dim = dimensions.find(d => d.code === q.dim);
  const pct = Math.round((currentQ - 1) / questions.length * 100);
  const prevAnswer = answers[currentQ - 1];

  el.innerHTML = `
    <div class="fade-in">
      <div class="progress-text">${t('第','Question')} ${currentQ} / ${questions.length}</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="question-card">
        <div class="question-dim">${dim ? t(dim.cn, dim.en) : q.dim}</div>
        <div class="question-text">${t(q.cn, q.en)}</div>
        <div class="options">
          ${['a','b','c'].map((k,i) => `
            <button class="option ${prevAnswer===i+1?'selected':''}" onclick="selectOption(${i+1})">
              <span class="opt-label">${String.fromCharCode(65+i)}</span>
              ${t(q[k+'_cn'], q[k+'_en'])}
            </button>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function selectOption(val) {
  answers[currentQ - 1] = val;
  if (currentQ < questions.length) {
    currentQ++;
  }
  render();
}

function calcScores() {
  const dims = ['S1','S2','S3','E1','E2','E3','A1','A2','A3','Ac1','Ac2','Ac3','So1','So2','So3'];
  const scores = {};
  dims.forEach(d => {
    const qs = questions.filter(q => q.dim === d);
    let sum = 0;
    qs.forEach(q => {
      const idx = questions.indexOf(q);
      sum += (answers[idx] || 2);
    });
    scores[d] = sum;
  });
  return scores;
}

function scoreToLevel(score) {
  if (score <= 3) return 'L';
  if (score === 4) return 'M';
  return 'H';
}

function calcPattern(scores) {
  const dims = ['S1','S2','S3','E1','E2','E3','A1','A2','A3','Ac1','Ac2','Ac3','So1','So2','So3'];
  return dims.map(d => scoreToLevel(scores[d])).join('');
}

function manhattanDist(p1, p2) {
  const map = {'L':0,'M':1,'H':2};
  let dist = 0;
  for (let i = 0; i < p1.length; i++) {
    dist += Math.abs((map[p1[i]]||1) - (map[p2[i]]||1));
  }
  return dist;
}

function calcMatch(dist) {
  return Math.max(0, Math.round((1 - dist / 30) * 100));
}

function findMatches(pattern) {
  return characters.map(c => {
    const p = c.pattern.replace(/\s/g, '');
    const dist = manhattanDist(pattern, p);
    return { ...c, dist, match: calcMatch(dist) };
  }).sort((a, b) => b.match - a.match || a.dist - b.dist);
}

function renderResult(el) {
  const scores = calcScores();
  const pattern = calcPattern(scores);
  const matches = findMatches(pattern);
  const top = matches[0];
  const isEasterEgg = pattern === 'MMMMMMMMMMMMMMM';
  const isChaos = pattern === 'HHHHHHHHHHHHHHH' || pattern === 'LLLLLLLLLLLLLLL';

  const patternDisplay = pattern.replace(/\s/g,'').replace(/(.3)/g,'$1 ').trim();

  const dimCodes = ['S1','S2','S3','E1','E2','E3','A1','A2','A3','Ac1','Ac2','Ac3','So1','So2','So3'];
  const dimLabels = dimCodes.map(d => {
    const dim = dimensions.find(dm => dm.code === d);
    return dim ? t(dim.cn, dim.en) : d;
  });

  const dimScores = dimCodes.map(d => scores[d]);

  el.innerHTML = `
    <div class="result-page fade-in">
      <div class="result-title">${t('你的匹配结果','YOUR RESULT')}</div>

      <div class="match-card">
        <img class="char-img" src="${imgMap[top.img] || ''}" alt="${top.en}" />
        <div class="char-name">${top.en}</div>
        <div class="char-name-cn">${top.cn}</div>
        <div class="match-pct">${top.match}%</div>
        <div class="char-quote">${t(top.quote_cn, top.quote_en)}</div>
        <div class="char-desc">${t(top.char_desc_cn, top.char_desc_en)}</div>
      </div>

      <div class="radar-container">
        <canvas id="radarChart" width="400" height="400"></canvas>
      </div>

      <div class="pattern-display">
        <div class="pattern-label">${t('你的模式代码','Your Pattern Code')}</div>
        ${patternDisplay}
      </div>

      ${isEasterEgg ? `
        <div class="easter-egg">
          <div class="egg-title">🥚 ${t('彩蛋触发！','Easter Egg!')}</div>
          <div class="egg-text">${t('所有维度都是 M……你是 Echo 吗？一个真正的虚空行者。','All dimensions are M... Are you Echo? A true void walker.')}</div>
        </div>
      ` : ''}
      ${isChaos ? `
        <div class="easter-egg">
          <div class="egg-title">🌀 ${t('彩蛋触发！','Easter Egg!')}</div>
          <div class="egg-text">${t('你的选择如此极端……混沌之王降临！','Your choices are so extreme... The Chaos King arrives!')}</div>
        </div>
      ` : ''}

      <div class="ranking">
        <h3>${t('匹配排行','Match Ranking')}</h3>
        ${matches.slice(0,5).map((m,i) => `
          <div class="rank-item">
            <div class="rank-num">#${i+1}</div>
            <img class="rank-img" src="${imgMap[m.img] || ''}" alt="${m.en}" />
            <div class="rank-info">
              <div class="rank-name">${m.cn} ${m.en}</div>
              <div class="rank-sub">${t(m.desc_cn, m.desc_en).substring(0,40)}...</div>
            </div>
            <div class="rank-pct">${m.match}%</div>
          </div>
        `).join('')}
      </div>

      <button class="btn restart-btn" onclick="restart()">${t('重新测试','RESTART')}</button>
      <div class="footer">IsaacTI - ${t('以撒人格测试','The Binding of Isaac Personality Test')}</div>
    </div>
  `;

  drawRadar(dimLabels, dimScores);
}

function restart() {
  currentQ = 0;
  answers = [];
  render();
}

function drawRadar(labels, scores) {
  const canvas = document.getElementById('radarChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = 400, H = 400;
  canvas.width = W;
  canvas.height = H;
  const cx = W/2, cy = H/2;
  const R = 150;
  const n = labels.length;

  ctx.clearRect(0, 0, W, H);

  for (let ring = 1; ring <= 3; ring++) {
    const r = R * ring / 3;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(255,107,107,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R * Math.cos(angle), cy + R * Math.sin(angle));
    ctx.strokeStyle = 'rgba(255,107,107,0.2)';
    ctx.stroke();
  }

  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const idx = i % n;
    const val = scores[idx] / 6;
    const angle = (Math.PI * 2 * idx / n) - Math.PI / 2;
    const x = cx + R * val * Math.cos(angle);
    const y = cy + R * val * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.fillStyle = 'rgba(255,107,107,0.25)';
  ctx.fill();
  ctx.strokeStyle = '#ff6b6b';
  ctx.lineWidth = 2;
  ctx.stroke();

  for (let i = 0; i < n; i++) {
    const val = scores[i] / 6;
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const x = cx + R * val * Math.cos(angle);
    const y = cy + R * val * Math.sin(angle);
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ff6b6b';
    ctx.fill();
  }

  ctx.fillStyle = '#b090b0';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const lr = R + 25;
    const x = cx + lr * Math.cos(angle);
    const y = cy + lr * Math.sin(angle);
    ctx.fillText(labels[i], x, y + 4);
  }
}

render();
</script>
</body>
